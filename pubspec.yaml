name: lighthouse_mini
description: A minimal, local-first Good Things and Habit Tracker web app.
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  sembast: ^3.8.9+1
  sembast_web: ^2.4.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/lighthouse_logo.png
