name: lighthouse_mini
description: A minimal, local-first Good Things and Habit Tracker app.
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  path: ^1.9.1
  path_provider: ^2.1.6
  sembast: ^3.8.9+1
  sembast_web: ^2.4.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/lighthouse_mark.png

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  min_sdk_android: 21
  adaptive_icon_background: "#0B4F57"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    background_color: "#0B4F57"
    theme_color: "#0B4F57"
  windows:
    generate: true
    icon_size: 256
