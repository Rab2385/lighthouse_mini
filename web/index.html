<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Good Things und Habit Tracker – lokal und ruhig.">
  <!-- Browser / PWA bar colour, matching the app when it follows the system. -->
  <meta name="theme-color" content="#F7F8FA" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111718" media="(prefers-color-scheme: dark)">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Lighthouse">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Lighthouse</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Offline support (issue #12): our own service worker, see sw.js.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          await navigator.serviceWorker.register('sw.js');
          const ready = await navigator.serviceWorker.ready;
          // Hand over what this first visit already loaded, so it is cached
          // too. Flutter loads fonts a moment after start, hence the delay.
          setTimeout(() => {
            const urls = performance
              .getEntriesByType('resource')
              .map((entry) => entry.name)
              .concat(location.href);
            ready.active?.postMessage({ type: 'cache', urls });
          }, 3000);
        } catch (error) {
          console.warn('Lighthouse offline support unavailable', error);
        }
      });
    }
  </script>
</body>
</html>
